<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0b1220"/>
  <!-- Starfield -->
  <circle cx="80" cy="100" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="400" cy="60" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="450" cy="200" r="2" fill="#fff" opacity="0.4"/>
  <circle cx="60" cy="380" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="440" cy="420" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="200" cy="50" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="120" cy="460" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="380" cy="460" r="1.5" fill="#fff" opacity="0.4"/>
  <!-- Rocket body centered -->
  <g transform="translate(256,280) rotate(-35)">
    <!-- Rocket body -->
    <path d="M0,-130 C40,-90 48,-14 26,56 L-26,56 C-48,-14 -40,-90 0,-130 Z" fill="#f4efe3"/>
    <!-- Window -->
    <circle cx="0" cy="-40" r="18" fill="#5fd4d0" opacity="0.9"/>
    <circle cx="0" cy="-40" r="12" fill="#0b1220"/>
    <circle cx="0" cy="-40" r="7" fill="#4ea8ff" opacity="0.8"/>
    <!-- Left fin -->
    <path d="M-26,28 L-60,72 L-26,60 Z" fill="#4ea8ff"/>
    <!-- Right fin -->
    <path d="M26,28 L60,72 L26,60 Z" fill="#4ea8ff"/>
    <!-- Engine glow -->
    <ellipse cx="0" cy="70" rx="16" ry="8" fill="#ff6b35" opacity="0.9"/>
    <ellipse cx="0" cy="82" rx="10" ry="14" fill="#ff6b35" opacity="0.6"/>
    <ellipse cx="0" cy="98" rx="6" ry="10" fill="#f4efe3" opacity="0.4"/>
  </g>
</svg>
